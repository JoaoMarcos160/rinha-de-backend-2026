global
    maxconn 20000
    nbthread 2
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode http

    timeout connect 50ms
    timeout client 2s
    timeout server 2s
    timeout http-request 2s
    timeout check 3s

    option http-keep-alive

frontend http
    bind *:9999

    default_backend apps

backend apps
    balance roundrobin

    option http-server-close
    option forwardfor
    option httpchk GET /ready

    server api1 api1:3000 check inter 2s fall 3 rise 2 maxconn 10000
    server api2 api2:3000 check inter 2s fall 3 rise 2 maxconn 10000
