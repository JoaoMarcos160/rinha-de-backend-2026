global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 5
    timeout connect 10s
    timeout client 10s
    timeout server 10s
    timeout queue 10s

frontend main
    bind *:9999 backlog 4096
    default_backend apps

backend apps
    balance roundrobin
    default-server maxconn 10000
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock
