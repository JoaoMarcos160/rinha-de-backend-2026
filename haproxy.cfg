global
    maxconn 20000
    nbthread 1
    tune.bufsize 4096
    tune.maxrewrite 512

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    option tcp-smart-accept
    # option tcp-smart-connect
    timeout connect 5ms
    timeout client 2s
    timeout server 2s
    timeout queue 2s

frontend main
    bind *:9999 backlog 4096
    default_backend apps

backend apps
    balance roundrobin
    default-server maxconn 10000
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock
