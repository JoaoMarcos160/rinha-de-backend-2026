version: "3.9"

services:
  lb:
    image: haproxy:lts-alpine
    cpus: "0.1"
    mem_limit: "30m"

    ports:
      - "9999:9999"

    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    depends_on:
      - api1
      - api2
    restart: unless-stopped

  api1:
    build: .
    hostname: api1

    cpus: "0.45"
    mem_limit: "160m"

    environment:
      PORT: 3000
    restart: unless-stopped

  api2:
    build: .
    hostname: api2

    cpus: "0.45"
    mem_limit: "160m"

    environment:
      PORT: 3000
    restart: unless-stopped
